services:
  dvperforming:
    image: ghcr.io/vonpeper/dvprefoming:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dvperforming
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://dvperformingarts.com
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
    volumes:
      - /opt/dvperforming/.data:/app/.data
      - /opt/dvperforming/public/images/uploads:/app/public/images/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dvperforming.rule=Host(`dvperformingarts.com`) || Host(`www.dvperformingarts.com`)"
      - "traefik.http.routers.dvperforming.entrypoints=websecure"
      - "traefik.http.routers.dvperforming.tls.certresolver=letsencrypt"
      - "traefik.http.services.dvperforming.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dokploy-network:
    external: true
